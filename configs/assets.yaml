# Asset and generation policy for AI Comic Drama.
# Character and style LoRAs are optional. If disabled or absent, the pipeline
# falls back to reference images, expression images, and stable prompts.

comfyui_models_root: ""

style_lora:
  enabled: true
  name: ""
  strength_model: 0.7
  strength_clip: 0.7

character_loras:
  enabled: true
  optional: true

references:
  prefer_library_assets: true
  generate_missing_assets: true
  use_character_reference_for_shots: true
  use_expression_reference_for_shots: true

continuity:
  max_shot_duration_seconds: 5
  split_long_actions: true
  use_previous_tail_frame: true

voice:
  scene_level_tts: true
  fallback_per_shot_tts: true

bgm:
  enabled: false
  directory: "assets/bgm"
  volume: 0.15
  fade_in: 2.0
  fade_out: 3.0
  mood_mapping:
    happy: "upbeat.mp3"
    sad: "melancholy.mp3"
    angry: "intense.mp3"
    neutral: "ambient.mp3"
    tense: "suspense.mp3"
    romantic: "gentle.mp3"
