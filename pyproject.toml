[project]
name = "ai-comic-drama"
version = "1.0.0"
description = "AI-powered comic-drama generation pipeline"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "openai-whisper>=20231117",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
